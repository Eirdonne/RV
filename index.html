  <style>
    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #f4f4f5;

      --border: #e4e4e7;
      --hover: #f4f4f5;
      --ring: #18181b;
      --radius: 0.5rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      padding: 3rem 1.25rem 5rem;
    }

    .container { max-width: 720px; margin: 0 auto; }
    header { margin-bottom: 1.75rem; }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; color: var(--fg); }
    .subtitle { font-size: 0.875rem; color: var(--muted-fg); margin-top: 0.25rem; }

    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .search-wrapper { position: relative; flex: 1; }
    .search-icon {
      position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: var(--muted-fg); pointer-events: none;
    }

    #searchInput {
      width: 100%; height: 2.375rem; padding: 0.5rem 0.75rem 0.5rem 2.25rem;
      font-size: 0.875rem; font-family: inherit; color: var(--fg);
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    #searchInput::placeholder { color: var(--muted-fg); }
    #searchInput:focus { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }

    .btn {
      height: 2.375rem; padding: 0 0.75rem; font-size: 0.8125rem; font-weight: 500;
      font-family: inherit; color: var(--fg); background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; white-space: nowrap; transition: background-color 0.15s;
    }
    .btn:hover { background: var(--hover); }

    .accordion-root { border-top: 1px solid var(--border); }
    details { border-bottom: 1px solid var(--border); }
    details details {
      border-bottom: none; border-left: 1px solid var(--border);
      margin-left: 0.875rem; padding-left: 0.625rem;
    }

    summary {
      list-style: none; display: flex; align-items: center; justify-content: space-between;
      padding: 0.875rem 0.375rem; font-size: 0.9375rem; font-weight: 500;
      cursor: pointer; user-select: none; border-radius: 0.375rem; transition: background-color 0.15s;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { text-decoration: underline; text-underline-offset: 4px; }
    details details summary { padding: 0.625rem 0.375rem; font-size: 0.875rem; }

    .summary-left { display: flex; align-items: center; gap: 0.5rem; }
    .count-badge { font-size: 0.75rem; font-weight: 400; color: var(--muted-fg); text-decoration: none !important; }
    .chevron { width: 16px; height: 16px; color: var(--muted-fg); transition: transform 0.2s ease; flex-shrink: 0; }
    details[open] > summary .chevron { transform: rotate(180deg); }

    .folder-content { padding-bottom: 0.625rem; }
    .file-list {
      list-style: none; margin-left: 0.875rem; padding-left: 0.625rem;
      border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.125rem;
    }

    .file-item a {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      padding: 0.45rem 0.625rem; font-size: 0.85rem; color: var(--fg);
      text-decoration: none; border-radius: 0.375rem; transition: background-color 0.12s;
    }
    .file-item a:hover { background-color: var(--hover); }
    .file-left { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .file-icon { width: 14px; height: 14px; color: var(--muted-fg); flex-shrink: 0; }
    .file-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .badge {
      font-size: 0.6875rem; font-weight: 500; padding: 0.1rem 0.45rem;
      border-radius: 9999px; border: 1px solid var(--border); color: var(--muted-fg);
      background: var(--bg); flex-shrink: 0;
    }
    .badge-pdf { color: #09090b; background: var(--muted); }
    .empty-state { display: none; text-align: center; padding: 3rem 1rem; color: var(--muted-fg); font-size: 0.875rem; }
    .hidden { display: none !important; }
  </style>

const CHEVRON_SVG = `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
const FILE_SVG = `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>`;
function countFiles(node) {
let total = node.files ? node.files.length : 0;
if (node.children) {
node.children.forEach(child => total += countFiles(child));
}
return total;
}
function renderNode(node) {
const details = document.createElement("details");
details.dataset.folderName = node.name.toLowerCase();
const summary = document.createElement("summary");
const totalFiles = countFiles(node);
summary.innerHTML = `<span class="summary-left"> <span>${node.name}</span> <span class="count-badge">${totalFiles}</span> </span> ${CHEVRON_SVG}`;
details.appendChild(summary);
const content = document.createElement("div");
content.className = "folder-content";
if (node.children) {
node.children.forEach(child => content.appendChild(renderNode(child)));
}
if (node.files) {
const ul = document.createElement("ul");
ul.className = "file-list";
node.files.forEach(file => {
const li = document.createElement("li");
li.className = "file-item";
li.dataset.fileName = file.title.toLowerCase();
const isPdf = file.path.toLowerCase().endsWith(".pdf");
const encodedHref = file.path.split("/").map(encodeURIComponent).join("/");
const a = document.createElement("a");
a.href = encodedHref;
a.target = "_blank";
a.rel = "noopener noreferrer";
a.innerHTML = `<span class="file-left"> ${FILE_SVG} <span class="file-title" title="${file.title}">${file.title}</span> </span> <span class="badge ${isPdf ? 'badge-pdf' : ''}">${isPdf ? 'PDF' : 'HTML'}</span>`;
li.appendChild(a);
ul.appendChild(li);
});
content.appendChild(ul);
}
details.appendChild(content);
return details;
}
const root = document.getElementById("directoryRoot");
DIRECTORY_DATA.forEach(subject => root.appendChild(renderNode(subject)));
const searchInput = document.getElementById("searchInput");
const emptyState = document.getElementById("emptyState");
searchInput.addEventListener("input", () => {
const query = searchInput.value.trim().toLowerCase();
const allDetails = Array.from(root.querySelectorAll("details"));
if (!query) {
root.querySelectorAll(".hidden").forEach(el => el.classList.remove("hidden"));
allDetails.forEach(d => d.open = false);
emptyState.style.display = "none";
return;
}
function filterDetails(detailsEl) {
const folderMatches = detailsEl.dataset.folderName.includes(query);
let hasVisibleChild = false;
const childDetails = Array.from(detailsEl.querySelector(":scope > .folder-content").children)
.filter(el => el.tagName === "DETAILS");
childDetails.forEach(child => {
if (filterDetails(child)) hasVisibleChild = true;
});
const fileItems = Array.from(detailsEl.querySelectorAll(":scope > .folder-content > .file-list > .file-item"));
fileItems.forEach(li => {
const fileMatches = li.dataset.fileName.includes(query) || folderMatches;
li.classList.toggle("hidden", !fileMatches);
if (fileMatches) hasVisibleChild = true;
});
const shouldShow = folderMatches || hasVisibleChild;
detailsEl.classList.toggle("hidden", !shouldShow);
detailsEl.open = shouldShow;
return shouldShow;
}
let anyVisible = false;
const topLevel = Array.from(root.children);
topLevel.forEach(d => {
if (filterDetails(d)) anyVisible = true;
});
emptyState.style.display = anyVisible ? "none" : "block";
});
const toggleAllBtn = document.getElementById("toggleAllBtn");
let allExpanded = false;
toggleAllBtn.addEventListener("click", () => {
allExpanded = !allExpanded;
root.querySelectorAll("details:not(.hidden)").forEach(d => d.open = allExpanded);
toggleAllBtn.textContent = allExpanded ? "Collapse All" : "Expand All";
});
</script>
